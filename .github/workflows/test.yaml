name: Run Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  check_test_all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Run tests
        run: uv run python -m unittest discover --start-directory tests
